const DAY = 86400000;
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const today = () => iso(new Date());
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/DAY);
const fmtMD = s => s ? (+s.slice(5,7))+"/"+(+s.slice(8,10)) : "";

/* 決策儲存：want / skip / done */
const KEY = "hub_experience_decisions";
function getDecisions(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch{ return {}; } }
function setDecision(id, v){
  const d = getDecisions();
  if (v) d[id] = { v, at: Date.now() }; else delete d[id];
  try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
  return d;
}

/* 今天在哪、還會去哪 */
function tripStatus(t){
  t = t || today();
  const day = TRIP.days.find(x => x.d === t);
  const left = daysBetween(t, TRIP.endEurope);
  const upcoming = [...new Set(TRIP.days.filter(x => x.d >= t && x.d <= TRIP.end).map(x => x.k))];
  return {
    today: t,
    city: day ? day.city : "",
    cityKey: day ? day.k : "",
    left,
    upcoming,
    inTrip: t >= TRIP.start && t <= TRIP.end,
  };
}

/* 這座城市你還剩幾天？今天是不是最後一天？ */
function cityDaysLeft(cityKey, t){
  t = t || today();
  const remaining = TRIP.days.filter(x => x.d >= t && x.k === cityKey);
  return { n: remaining.length, isLast: remaining.length === 1, lastDate: remaining.length ? remaining[remaining.length-1].d : null };
}

/* 單項體驗的當下狀態 */
function evalExp(exp, cityKey, t){
  t = t || today();
  const st = tripStatus(t);
  const dec = getDecisions()[exp.id];
  const cd = cityDaysLeft(cityKey, t);

  // 季節
  const inSeason = t >= exp.season.from && t <= exp.season.to;
  const seasonEndsIn = daysBetween(t, exp.season.to);
  const isClosedToday = (exp.closed || []).includes(t);

  // 還去不去得到這座城市？
  const willVisit = st.upcoming.includes(cityKey);
  const hereToday = st.cityKey === cityKey;

  let level, label;
  if (dec && dec.v === "done")      { level = "done";   label = "已完成"; }
  else if (dec && dec.v === "skip") { level = "skip";   label = "已略過"; }
  else if (!willVisit)              { level = "missed"; label = "已離開這座城市"; }
  else if (!inSeason && t > exp.season.to) { level="missed"; label = "季節已過"; }
  else if (hereToday && isClosedToday)     { level="warn";   label = "今天公休"; }
  else if (hereToday && cd.isLast)         { level="urgent"; label = "🔴 今天是這座城市最後一天"; }
  else if (hereToday)                      { level="today";  label = "今天在這裡，還有 "+cd.n+" 天"; }
  else if (inSeason && seasonEndsIn <= 7)  { level="warn";   label = "季節剩 "+seasonEndsIn+" 天"; }
  else                                     { level="ok";     label = cd.n+" 天後會到"; }

  return { level, label, inSeason, isClosedToday, willVisit, hereToday, cityDays: cd, decision: dec ? dec.v : null };
}

/* 全域掃描：回傳排序後的清單 */
function scan(t){
  t = t || today();
  const out = [];
  Object.entries(EXPERIENCES).forEach(([ck, list]) => {
    list.forEach(exp => {
      const ev = evalExp(exp, ck, t);
      out.push({ ...exp, cityKey: ck, cityName: CITY_NAME[ck] || ck, ...ev });
    });
  });
  const order = { urgent:0, warn:1, today:2, ok:3, done:4, skip:5, missed:6 };
  out.sort((a,b) => (order[a.level]-order[b.level]) || (b.missRisk-a.missRisk));
  return out;
}

/* 首頁警示用：只回傳需要注意的 */
function alerts(t){
  return scan(t).filter(x => ["urgent","warn","today"].includes(x.level) && !x.decision);
}


/* ══════════ UI ══════════ */
var FILTER = "all";
var OPEN = {};

var RISK = ["", "🟡", "🟠", "🔴"];
var LV = {
  urgent:{c:"#C8102E", bg:"#FDECEF"}, warn:{c:"#E8A400", bg:"#FFF8E5"},
  today:{c:"#2E7D32", bg:"#E8F5E9"}, ok:{c:"#5A6B7E", bg:"#EEF2F6"},
  done:{c:"#2E7D32", bg:"#E8F5E9"}, skip:{c:"#9AA7B6", bg:"#F0F2F5"},
  missed:{c:"#9AA7B6", bg:"#F0F2F5"}
};

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  var st = tripStatus();
  var list = scan();
  var act = list.filter(function(x){ return ["urgent","warn","today"].includes(x.level) && !x.decision; });

  var counts = {
    all: list.length,
    act: act.length,
    r3: list.filter(function(x){ return x.missRisk===3 && !x.decision && x.level!=="missed"; }).length,
    done: list.filter(function(x){ return x.decision==="done"; }).length
  };

  var shown = list.filter(function(x){
    if (FILTER==="act")  return ["urgent","warn","today"].includes(x.level) && !x.decision;
    if (FILTER==="r3")   return x.missRisk===3;
    if (FILTER==="done") return x.decision==="done";
    if (FILTER!=="all" && FILTER!=="missedlist") return x.cityKey===FILTER;
    return FILTER==="all";
  });

  var h = "";

  /* 看板 */
  h += '<div class="board"><div class="rail"></div>';
  h += '<div class="eyebrow">MISS RADAR</div>';
  if (st.inTrip) {
    h += '<div class="display">' + esc(st.city || "旅程中") + '</div>';
    h += '<div style="display:flex;gap:24px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)">';
    h += stat("回程倒數", st.left>0?st.left:0, "天");
    h += stat("待處理", counts.act, "項");
    h += stat("錯過就沒了", counts.r3, "項");
    h += '</div>';
    if (act.length) {
      var u = act.filter(function(x){return x.level==="urgent";});
      if (u.length) {
        h += '<div style="margin-top:14px;background:#C8102E;border-radius:10px;padding:11px 12px;font-size:12.5px;font-weight:800;line-height:1.6">';
        h += '⏰ 今天是 ' + esc(u[0].cityName) + ' 最後一天 — ' + u.slice(0,3).map(function(x){return esc(x.n);}).join("、");
        h += (u.length>3 ? " …等 "+u.length+" 項" : "") + '</div>';
      }
    }
  } else {
    h += '<div class="display">目前沒有進行中的旅程</div>';
  }
  h += '</div>';

  /* 篩選 */
  h += '<div class="chips">';
  h += chip("act", "待處理 " + counts.act);
  h += chip("r3", "🔴 錯過就沒了 " + counts.r3);
  h += chip("all", "全部 " + counts.all);
  ["zermatt","stmoritz","zurich","dubai"].forEach(function(k){
    if (EXPERIENCES[k]) h += chip(k, (st.cityKey===k?"● ":"") + CITY_NAME[k]);
  });
  h += chip("done", "已完成 " + counts.done);
  h += chip("missedlist", "已錯過");
  h += '</div>';

  /* 已錯過清單 */
  if (FILTER==="missedlist") {
    h += '<div class="c" style="border-left:4px solid #C8102E">';
    h += '<div class="sec" style="color:#C8102E">已確認錯過（記錄下來，下次不再犯）</div>';
    MISSED.forEach(function(m){
      h += '<div style="padding:10px 0;border-bottom:1px solid #F0F4F8">';
      h += '<div class="tt" style="color:#C8102E">' + esc(m.n) + '</div>';
      h += '<div class="meta">' + esc(CITY_NAME[m.city]||m.city) + (m.date?" · "+esc(m.date):"") + '</div>';
      h += '<div class="body">' + esc(m.why) + '</div></div>';
    });
    h += '</div>';
  } else {
    if (!shown.length) h += '<div class="c" style="text-align:center;color:#78899E;font-size:13px;padding:30px">沒有符合的項目</div>';
    shown.forEach(function(x){ h += card(x); });
  }

  h += '<div style="height:20px"></div>';
  document.getElementById("app").innerHTML = h;
}

function stat(k,v,u){
  return '<div><div style="font-size:10px;opacity:.6;letter-spacing:1px;font-weight:800">'+k+'</div>'
    + '<div style="font-size:24px;font-weight:900;margin-top:2px">'+v
    + '<span style="font-size:12px;font-weight:700;opacity:.7;margin-left:3px">'+u+'</span></div></div>';
}
function chip(k,label){
  return '<button class="chip'+(FILTER===k?" on":"")+'" onclick="setFilter(\''+k+'\')">'+esc(label)+'</button>';
}
function setFilter(k){ FILTER=k; render(); window.scrollTo(0,0); }

function card(x){
  var lv = LV[x.level] || LV.ok;
  var c = CAT[x.cat] || {n:x.cat, ic:"📌"};
  var open = OPEN[x.id];
  var h = '<div class="c" style="padding:0;overflow:hidden">';
  h += '<div class="item '+x.level+'" style="margin:0;border-radius:0">';

  h += '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">';
  h += '<div style="flex:1;min-width:0">';
  h += '<div style="font-size:10.5px;font-weight:800;color:#78899E">'+c.ic+' '+esc(c.n)+' · '+esc(x.cityName)+'</div>';
  h += '<div class="tt" style="margin-top:3px">'+RISK[x.missRisk]+' '+esc(x.n)+'</div>';
  h += '<span class="lb" style="color:'+lv.c+';background:'+lv.bg+';margin-top:6px">'+esc(x.label)+'</span>';
  h += '</div></div>';

  h += '<div class="meta">🕐 '+esc(x.hours)+'　·　⏱ 約 '+x.dur+' 分　·　💰 '+esc(x.cost)+'</div>';
  if (x.best) h += '<div class="meta">⭐ '+esc(x.best)+'</div>';

  if (open) {
    h += '<div class="body">'+esc(x.why)+'</div>';
    h += '<div class="meta">📍 '+esc(x.loc)+'</div>';
    h += '<div class="meta">🚶 '+esc(x.access)+'</div>';
    h += '<div class="meta">📅 季節：'+fmtMD(x.season.from)+' – '+fmtMD(x.season.to)+'</div>';
    if (x.warn) h += '<div class="warn">'+esc(x.warn)+'</div>';
    if (x.lat) h += '<div style="margin-top:9px"><a href="https://www.google.com/maps/search/?api=1&query='+x.lat+','+x.lon+'" target="_blank" style="display:block;text-align:center;background:#EEF4FF;color:#1F3864;padding:9px;border-radius:8px;font-size:12.5px;font-weight:800;text-decoration:none">🗺 開啟地圖</a></div>';
    h += '<div class="src">來源：'+x.src.map(function(s){return esc(s.s)+"（"+({high:"高可信",mid:"參考",low:"存疑"}[s.lv])+"）";}).join("、")+'</div>';
  }
  h += '<button class="more" onclick="tog(\''+x.id+'\')">'+(open?"收起 ▲":"詳細 ▼")+'</button>';

  h += '<div class="btns">';
  h += '<button class="btn'+(x.decision==="want"?" on-want":"")+'" onclick="dec(\''+x.id+'\',\'want\')">想去</button>';
  h += '<button class="btn'+(x.decision==="done"?" on-done":"")+'" onclick="dec(\''+x.id+'\',\'done\')">✓ 已完成</button>';
  h += '<button class="btn'+(x.decision==="skip"?" on-skip":"")+'" onclick="dec(\''+x.id+'\',\'skip\')">略過</button>';
  h += '</div>';

  h += '</div></div>';
  return h;
}

function tog(id){ OPEN[id] = !OPEN[id]; render(); }
function dec(id,v){
  var cur = getDecisions()[id];
  setDecision(id, (cur && cur.v===v) ? null : v);
  render();
}

try { render(); }
catch(e){
  document.getElementById("app").innerHTML =
    '<div style="padding:24px;color:#C8102E;font-family:monospace;font-size:12px;white-space:pre-wrap">錯誤：'
    + esc(e.stack||e.message) + '</div>';
}
</script>
